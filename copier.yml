_min_copier_version: 9.0.0
_subdirectory: template
action_name:
  type: str
  help: What is your action name?
  validator: >-
    {% if not action_name %}
    action_name cannot be empty.
    {% endif %}

action_slug:
  type: str
  default: "{{ action_name | lower | replace(' ', '-') }}"
  when: false

action_description:
  type: str
  help: A short description of your action.

github_repository:
  type: str
  help: GitHub repository identifier (username/repo-name).
  validator: >-
    {% if not (github_repository | regex_search('^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$')) %}
    github_repository must be in the format 'username/repo-name'.
    {% endif %}

github_url:
  type: str
  help: The homepage URL for your project.
  when: false

branding_color:
  type: str
  help: The color of the GitHub Action branding.
  default: "blue"
  choices:
    - white
    - yellow
    - blue
    - green
    - orange
    - red
    - purple
    - gray-dark

# Global tasks
_tasks:
  - "git init"
